name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    if: false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ai_provider: openai
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-4o
          review_level: full
          max_files: 10
          batch_size: 3
          # file_include: "src/**/*.{ts,tsx}"
          # file_exclude: "dist/**,*.lock"
